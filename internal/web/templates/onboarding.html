{{define "onboarding-progress"}}<ol class="onboarding-progress" aria-label="設定進度"><li {{if eq . "administrator"}}aria-current="step"{{end}}><span class="step-number">1</span><span>建立管理員</span></li><li {{if eq . "pikpak"}}aria-current="step"{{end}}><span class="step-number">2</span><span>連接 PikPak</span></li></ol>{{end}}
<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><script src="/static/theme.js"></script><title>PikPak RSS · 連接 PikPak</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/theme.css"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><script src="/static/i18n.js" defer></script><script src="/static/app.js" defer></script></head>
<body class="login-page setup-page"><main class="login-shell"><div class="login-header"><img class="brand-mark" src="/static/favicon.svg" alt=""><div class="appearance-controls"><button type="button" class="theme-toggle" aria-label="切換深色模式" title="切換深色模式" aria-pressed="false">☾</button><button type="button" class="language-toggle" lang="en" aria-label="切換為英文">English</button></div></div>
{{template "onboarding-progress" "pikpak"}}
<h1>連接 PikPak</h1><form id="token-form" class="login-form" data-onboarding="true"><div class="setup-field"><label for="token">個人存取權杖（PAT）</label><input id="token" type="password" autocomplete="off" required placeholder="貼上 PAT" aria-describedby="token-permissions"></div><div class="token-help"><p id="token-permissions" class="field-help">PAT 需具備「讀寫檔案」及「雲端下載」權限。</p><a class="text-link" href="https://mypikpak.com/en-US/help-center/connected_apps/personal_access_tokens/create_personal_access_token" target="_blank" rel="noopener noreferrer">建立 PAT ↗</a><details class="token-notes"><summary>有效期與配額</summary><p class="field-help">PAT 有效期為 30 天至一年，請在到期前更新。</p><p class="field-help">已連接的應用共用各流量維度月配額的 25%，包含雲端離線下載。</p></details></div><button id="save-token" class="button primary" type="submit">驗證並完成設定</button><p id="token-error" class="error" role="alert"></p></form><button id="logout" class="text-button onboarding-logout">登出</button></main></body></html>
